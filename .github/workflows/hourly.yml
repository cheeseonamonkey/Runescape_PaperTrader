name: Hourly paper trade

on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      reset:
        description: Reset both v0.4 wallets before this run
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osrs-papertrader-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b' }}
      OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'openrouter/free' }}
      OPENROUTER_SUBAGENT_MODEL: ${{ vars.OPENROUTER_SUBAGENT_MODEL || 'openrouter/free' }}
      ENABLE_WEB_RESEARCH: ${{ vars.ENABLE_WEB_RESEARCH || '1' }}
      ENABLE_SUBAGENT: ${{ vars.ENABLE_SUBAGENT || '0' }}
      ENABLE_FREE_AUX: ${{ vars.ENABLE_FREE_AUX || '1' }}
      FREE_AUX_PASSES: ${{ vars.FREE_AUX_PASSES || '3' }}
      ENABLE_DDGS: ${{ vars.ENABLE_DDGS || '1' }}
      DDGS_EVERY_HOURS: ${{ vars.DDGS_EVERY_HOURS || '6' }}
      HISTORY_EVERY_HOURS: ${{ vars.HISTORY_EVERY_HOURS || '6' }}
      HISTORY_ITEMS: ${{ vars.HISTORY_ITEMS || '5' }}
      OSRS_WIKI_USER_AGENT: ${{ vars.OSRS_WIKI_USER_AGENT || 'Runescape_PaperTrader/0.4 - github.com/cheeseonamonkey/Runescape_PaperTrader' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install optional research dependency
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v5

      - name: Static checks
        run: |
          python3 -m compileall -q src scripts tests
          python3 -m unittest discover -s tests -q
          node --check site/app.js

      - name: Run v0.4 multi-wallet engine
        if: github.event_name != 'push'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.reset }}" == "true" ]]; then
            python3 scripts/run.py --reset | tee /tmp/papertrader-run.txt
          else
            python3 scripts/run.py | tee /tmp/papertrader-run.txt
          fi
          {
            echo "### v0.4 hourly cycle"
            echo '```text'
            cat /tmp/papertrader-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot invariants
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python3 scripts/verify_state.py --allow-stale-version
          else
            python3 scripts/verify_state.py
          fi

      - name: Build mobile site
        run: python3 scripts/build_site.py

      - name: Persist hourly state
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: hourly v0.4 snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
