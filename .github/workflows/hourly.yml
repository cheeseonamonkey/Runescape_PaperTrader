name: Hourly paper trade
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: Reset both v0.3 wallets before this run
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: osrs-papertrader-hourly
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b' }}
      OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'openrouter/free' }}
      OPENROUTER_SUBAGENT_MODEL: ${{ vars.OPENROUTER_SUBAGENT_MODEL || 'openrouter/free' }}
      ENABLE_WEB_RESEARCH: ${{ vars.ENABLE_WEB_RESEARCH || '1' }}
      ENABLE_SUBAGENT: ${{ vars.ENABLE_SUBAGENT || '0' }}
      ENABLE_FREE_AUX: ${{ vars.ENABLE_FREE_AUX || '1' }}
      FREE_AUX_PASSES: ${{ vars.FREE_AUX_PASSES || '3' }}
      ENABLE_DDGS: ${{ vars.ENABLE_DDGS || '1' }}
      DDGS_EVERY_HOURS: ${{ vars.DDGS_EVERY_HOURS || '6' }}
      HISTORY_EVERY_HOURS: ${{ vars.HISTORY_EVERY_HOURS || '6' }}
      HISTORY_ITEMS: ${{ vars.HISTORY_ITEMS || '5' }}
      OSRS_WIKI_USER_AGENT: ${{ vars.OSRS_WIKI_USER_AGENT || 'Runescape_PaperTrader/0.3 - github.com/cheeseonamonkey/Runescape_PaperTrader' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install optional research dependency
        run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - name: Static checks
        run: |
          python3 -m compileall -q src scripts
          node --check site/app.js
      - name: Run v0.3 multi-wallet engine
        run: |
          if [[ "${{ inputs.reset }}" == "true" ]]; then python3 scripts/run.py --reset; else python3 scripts/run.py; fi
      - name: Snapshot invariants
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/latest_snapshot.json'))
          assert d['version']=='0.3'
          assert set(d['wallets'])=={'velocity','market_maker'}
          for k,w in d['wallets'].items():
              assert w['value_gp']>=0 and w['cash_gp']>=0
              assert isinstance(w['top_candidates'],list)
              assert w['id']==k
          assert isinstance(d['market']['top_by_turnover'],list)
          PY
      - name: Build mobile site
        run: python3 scripts/build_site.py
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: hourly v0.3 multi-wallet snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
